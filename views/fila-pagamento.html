<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Fila de pagamento | FlowPay</title>
    <link rel="stylesheet" href="../src/payment-page-style.css">
</head>
<body>
    <main class="payment-page">
        <a class="back-link" href="./final-page.html">Voltar às formas de pagamento</a>

        <section class="cash-queue-content" aria-labelledby="cash-queue-title">
            <h1 id="cash-queue-title">Fila de pagamento</h1>
            <p class="payment-description">
                Você escolheu pagar em dinheiro. Aguarde sua vez e faça o pagamento no atendimento.
            </p>

            <div class="cash-queue-number" role="status" aria-live="polite">
                <span>Seu número para pagamento</span>
                <strong>1</strong>
            </div>
            <p class="cash-queue-note">
                Apresente seu número quando for chamado. Esta fila é demonstrativa.
            </p>
        </section>
    </main>
</body>
</html>
